<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AwasBey Web-OS Remote</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: white; }

        .desktop {
            width: 100vw;
            height: calc(100vh - 48px);
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            position: relative;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .watermark {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.15); font-size: 28px; font-weight: 900;
            pointer-events: none;
        }

        .icon {
            width: 85px; height: 90px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; cursor: pointer; text-align: center;
        }
        .icon:active { background: rgba(255, 255, 255, 0.2); }
        .icon i { font-size: 32px; margin-bottom: 6px; }
        .icon span { font-size: 11px; font-weight: 600; }

        .window {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            width: 92vw; max-width: 550px; height: 65vh;
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); display: none; flex-direction: column; z-index: 100;
        }

        .window-header {
            background: rgba(15, 23, 42, 0.9); padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .window-body { flex: 1; padding: 16px; overflow-y: auto; }

        .card {
            background: rgba(255,255,255,0.05); padding: 12px;
            border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);
        }

        .btn {
            background: #38bdf8; color: #0f172a; border: none; padding: 10px 14px;
            border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px;
        }
        .btn-danger { background: #ef4444; color: white; }

        input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: white; margin-bottom: 8px; outline: none;
        }

        .taskbar {
            width: 100vw; height: 48px; background: rgba(15, 23, 42, 0.95);
            position: fixed; bottom: 0; left: 0; display: flex; align-items: center;
            justify-content: space-between; padding: 0 12px; border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="watermark">By: AwasBey</div>

        <div class="icon" onclick="openWindow('appLauncher')">
            <i class="fa-solid fa-rocket" style="color: #38bdf8;"></i>
            <span>Program Başlat</span>
        </div>

        <div class="icon" onclick="openWindow('sysControl')">
            <i class="fa-solid fa-power-off" style="color: #ef4444;"></i>
            <span>Sistem Kontrol</span>
        </div>
    </div>

    <!-- PROGRAM BAŞLATICI PENCERESİ -->
    <div id="appLauncher" class="window">
        <div class="window-header">
            <span style="color:#38bdf8; font-weight:bold;"><i class="fa-solid fa-rocket"></i> Gerçek PC Program Çalıştırıcı</span>
            <i class="fa-solid fa-xmark" onclick="closeWindow('appLauncher')" style="cursor:pointer;"></i>
        </div>
        <div class="window-body">
            <div class="card">
                <p style="font-size:12px; margin-bottom:8px; color:#94a3b8;">Hızlı Çalıştır:</p>
                <button class="btn" onclick="launchApp('chrome.exe')"><i class="fa-brands fa-chrome"></i> Google Chrome Aç</button>
                <button class="btn" onclick="launchApp('notepad.exe')"><i class="fa-solid fa-file-lines"></i> Not Defteri Aç</button>
                <button class="btn" onclick="launchApp('calc.exe')"><i class="fa-solid fa-calculator"></i> Hesap Makinesi Aç</button>
            </div>

            <div class="card">
                <p style="font-size:12px; margin-bottom:8px; color:#94a3b8;">Özel EXE veya Dosya Yolu Aç:</p>
                <input type="text" id="customPath" placeholder="Örn: C:\\Windows\\explorer.exe veya dosya yolu">
                <button class="btn" onclick="launchCustom()"><i class="fa-solid fa-play"></i> Bilgisayarda Çalıştır</button>
            </div>
        </div>
    </div>

    <!-- SİSTEM KONTROL -->
    <div id="sysControl" class="window">
        <div class="window-header">
            <span style="color:#ef4444; font-weight:bold;"><i class="fa-solid fa-power-off"></i> Güç Menüsü</span>
            <i class="fa-solid fa-xmark" onclick="closeWindow('sysControl')" style="cursor:pointer;"></i>
        </div>
        <div class="window-body">
            <div class="card">
                <p style="font-size:13px; margin-bottom:10px;">Durum: <strong id="pcStatus" style="color:#eab308;">Bağlanıyor...</strong></p>
                <button class="btn btn-danger" onclick="sendCommand('shutdown')">Bilgisayarı Kapat</button>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <button style="background:linear-gradient(135deg,#6366f1,#a855f7); color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:bold;" onclick="openWindow('appLauncher')">
            <i class="fa-brands fa-windows"></i> Başlat
        </button>
        <span id="clock" style="color:#cbd5e1; font-size:12px;">00:00</span>
    </div>

    <script>
        const HOST = 'http://localhost:8080';

        function openWindow(id) { document.getElementById(id).style.display = 'flex'; }
        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }

        async function launchApp(path) {
            try {
                const res = await fetch(`${HOST}/?cmd=launch&path=${encodeURIComponent(path)}`);
                const data = await res.json();
                alert(data.result || "Komut Gönderildi! [By: AwasBey]");
            } catch(e) {
                alert("Hata: PC Arka Plan Servisi Kapalı!");
            }
        }

        function launchCustom() {
            const val = document.getElementById('customPath').value;
            if(val) launchApp(val);
        }

        async function checkConnection() {
            try {
                const res = await fetch(`${HOST}/?cmd=ping`);
                const data = await res.json();
                if(data.online) document.getElementById('pcStatus').innerText = "ONLINE (PC Bağlı)";
            } catch(e) {
                document.getElementById('pcStatus').innerText = "OFFLINE (C# Servisini Açın)";
            }
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }, 1000);

        checkConnection();
    </script>
</body>
</html>
